name: Container
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t showcase-core .
      - run: docker run --rm --network none showcase-core
      - run: docker build -t showcase-dev .devcontainer
      - run: docker run --rm showcase-dev sh -c 'node --version && npm --version && python3 --version'
