name: Draft release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-full
      - run: npm run verify:full
      - run: |
          tar -czf showcase-reports.tar.gz catalog/generated verification/latest.json verification/detection.json verification/extended.json website/public/reports
          sha256sum showcase-reports.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-reports
          path: |
            showcase-reports.tar.gz
            SHA256SUMS
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified artifacts and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name release-reports
          gh release create "$RELEASE_TAG" showcase-reports.tar.gz SHA256SUMS --draft --generate-notes
